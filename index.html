<style>

</style></head><body>
<header>✒️ Muallif<span id="cs"></span></header>
<main id="m"></main>
<nav id="nav"></nav>
<div id="sheet"><div id="sb"></div></div><div id="toast"></div>
<script>
const GR=[["#b4562b","#6e2a12"],["#2f6f6a","#123a37"],["#4b3f8f","#1f1a48"],["#2b2b2b","#000"],["#a8325e","#4a0f27"],["#b8902a","#5e470d"],["#2f7a4a","#0e3b22"],["#2d4f98","#0f2250"]];
const FONTS=["Georgia,serif","system-ui,sans-serif","'Courier New',monospace"];
let S={tab:"books",bi:0,ci:0,cp:0,sy:0,notes:[],paid:false,goal:500,books:[{title:"Mening birinchi kitobim",author:"Muallif",g:0,f:0,ch:[{t:"1-bob",x:""}]}]};
try{const r=localStorage.getItem("muallif");if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
const $=id=>document.getElementById(id);
const save=()=>{try{localStorage.setItem("muallif",JSON.stringify(S))}catch(e){toast("Xotira to‘ldi: saqlanmadi")}sched()};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
if(!S.books[S.bi])S.bi=0;const B=()=>S.books[S.bi];
const words=t=>(t.trim().match(/\S+/g)||[]).length;
const total=b=>b.ch.reduce((a,c)=>a+words(c.x),0);
function toast(t){const e=$("toast");e.textContent=t;e.style.display="block";setTimeout(()=>e.style.display="none",2600)}
function go(t){keep();S.tab=t;save();render()}
function render(){stopVoice();
 const T=[["books","📚","Kitoblar"],["write","✍️","Yozish"],["notes","💡","Daftar"],["cover","🎨","Muqova"],["me","👤","Profil"]];
 $("nav").innerHTML=T.map(a=>`<button class="${S.tab==a[0]?"on":""}" onclick="go('${a[0]}')"><b>${a[1]}</b>${a[2]}</button>`).join("");
 const m=$("m");
 if(S.tab=="books"){
  m.innerHTML=`<div class="hero"><small>Salom, muallif 👋</small><div class="hq">Bugun nima yozamiz?</div><div class="bar"><i style="width:${Math.min(100,today()/S.goal*100)}%"></i></div><small>Bugun: ${today()} / ${S.goal} so‘z${streak()?" · 🔥 "+streak()+" kun ketma-ket":""}</small></div><h2>Mening kitoblarim</h2>`+resume()+S.books.map((b,i)=>`<div class="card mini">${cov(b)}<div style="flex:1"><b>${esc(b.title)}</b><br><small>${b.ch.length} bob · ${total(b)} so'z</small><div class="row" style="margin-top:8px"><button class="btn" onclick="if(S.bi!=${i}){S.cp=0;S.sy=0}S.bi=${i};S.ci=S.books[${i}].lc||0;go('write')">Yozish</button><button class="btn o" onclick="S.bi=${i};go('cover')">Muqova</button></div></div></div>`).join("")+
  `<button class="btn" style="width:100%" onclick="newBook()">+ Yangi kitob</button><p class="m">Birinchi kitob bepul. Keyingilari uchun obuna kerak.</p>`;
 }
 if(S.tab=="write"){
  const b=B();if(!b.ch[S.ci])S.ci=0;b.lc=S.ci;const c=b.ch[S.ci],w=total(b),p=Math.min(100,today()/S.goal*100);
  m.innerHTML=`<div class="row"><select onchange="S.ci=+this.value;S.cp=0;S.sy=0;save();render()">${b.ch.map((x,i)=>`<option value="${i}" ${i==S.ci?"selected":""}>${esc(x.t)}</option>`).join("")}</select><button class="btn o" style="flex:0 0 auto" onclick="addCh()">+ Bob</button><button class="btn o" style="flex:0 0 auto" onclick="chs()">☰</button></div>
  <input value="${esc(c.t)}" oninput="ap(this);B().ch[S.ci].t=this.value;save()" placeholder="Bob nomi">
  <div class="syms">${symList().map(k=>`<button class="btn o sym" onpointerdown="event.preventDefault()" onclick="insK('${k=="↵"?"\\n":k}')">${k}</button>`).join("")}</div><textarea id="ta" onblur="keep();save()" onscroll="S.sy=this.scrollTop" placeholder="Hikoyangizni shu yerda yozing…" oninput="ap(this);B().ch[S.ci].x=this.value;S.cp=this.selectionStart;S.sy=this.scrollTop;save();stat()">${esc(c.x)}</textarea>
  <div class="bar"><i id="pb" style="width:${p}%"></i></div><small id="st"></small><div class="row" style="margin-top:10px"><button class="btn" id="mic" onclick="voice()">🎤 Gapirib yozish</button><select style="flex:0 0 40%" onchange="S.vl=this.value;save()">${[["uz-UZ","O‘zbekcha"],["ru-RU","Русский"],["en-US","English"],["tr-TR","Türkçe"]].map(l=>`<option value="${l[0]}" ${(S.vl||"uz-UZ")==l[0]?"selected":""}>${l[1]}</option>`).join("")}</select></div><small>Buyruqlar: «nuqta», «vergul», «yangi qator», «abzats»</small>
  <div class="row" style="margin-top:10px;flex-wrap:wrap"><button class="btn o" onclick="tr()">Yozuv ⇄</button><button class="btn o" onclick="spell()">🔍 Imlo</button><button class="btn" onclick="exp()">Yuklab olish</button></div>`;stat();restore();
 }
 if(S.tab=="cover"){
  const b=B();
  m.innerHTML=`<h2>Muqova</h2>${cov(b)}<input value="${esc(b.title)}" oninput="ap(this);B().title=this.value;save();pv()" placeholder="Kitob nomi"><input value="${esc(b.author)}" oninput="ap(this);B().author=this.value;save();pv()" placeholder="Muallif">
  <small>Shablon</small><div class="tps">${TPN.map((n,i)=>`<div class="tp ${(b.tp||0)==i?"on":""}" onclick="B().tp=${i};save();render()">${coverSVG({...b,tp:i})}<small>${n}</small></div>`).join("")}</div><input type="file" id="fi" accept="image/*" hidden onchange="pic(this)">${b.img?`<button class="btn o" style="width:100%;margin:6px 0" onclick="rmi()">Rasmni olib tashlash</button>`:""}<small>Rang</small><div class="sw">${GR.map((g,i)=>`<span class="${b.g==i?"on":""}" style="background:${g[0]}" onclick="B().g=${i};save();render()"></span>`).join("")}</div>
  <small>Shrift</small><select onchange="B().f=+this.value;save();render()">${["Klassik","Zamonaviy","Mashinka"].map((n,i)=>`<option value="${i}" ${b.f==i?"selected":""}>${n}</option>`).join("")}</select>
  <button class="btn o" style="width:100%;margin-top:8px" onclick="$('fi').click()">📷 O'z rasmimni yuklash</button><div class="card" style="margin-top:14px"><b>Kitob haqida</b><select onchange="B().genre=this.value;save()">${GN.map(g=>`<option ${b.genre==g?"selected":""}>${g}</option>`).join("")}</select><textarea style="min-height:110px" placeholder="Annotatsiya: kitob nima haqida?" oninput="B().about=this.value;save()">${esc(b.about||"")}</textarea></div>`;
 }
 if(S.tab=="notes")notesV();if(S.tab=="me"){
  m.innerHTML=`<h2>Profil</h2>${cloudCard()}<div class="card"><b>Muallif</b><br><small>${S.paid?"Premium · cheksiz kitoblar":"Bepul reja · 1 ta kitob"}</small>
  ${S.paid?"":`<button class="btn" style="width:100%;margin-top:10px" onclick="pay()">Premiumga o'tish</button>`}</div>
  <div class="card"><b>Kunlik maqsad</b><input type="number" value="${S.goal}" oninput="S.goal=+this.value||1;save()"><small>so'z</small></div>
  <div class="card"><b>Yozuv shakli</b> <small>(ovozli yozish va tugmalar uchun)</small><select onchange="S.sc=this.value;save();render()">${[["old","Eski lotin (o‘ g‘ sh ch)"],["new","Yangi lotin (ö ğ ş ç)"],["cyr","Кирилл"]].map(a=>`<option value="${a[0]}" ${(S.sc||"old")==a[0]?"selected":""}>${a[1]}</option>`).join("")}</select></div><div class="card"><b>Rang mavzusi</b> <small>${S.th==null?"Avto":TH[S.th].n}</small><div class="sw" style="margin-top:8px"><span class="${S.th==null?"on":""}" style="background:linear-gradient(135deg,#faf6ef 50%,#1b1612 50%)" onclick="setTh(null)"></span>${TH.map((t,i)=>`<span class="${S.th===i?"on":""}" style="background:${t.ac}" onclick="setTh(${i})"></span>`).join("")}</div></div><div class="card"><b>Zaxira nusxa</b><br><small>${S.pst?"Xotira himoyalangan ✓":"Xotira himoyasiz, zaxira oling"}${S.lb?" · oxirgi zaxira: "+S.lb:""}</small><div class="row" style="margin-top:8px"><button class="btn" onclick="bak()">Faylga saqlash</button><button class="btn o" onclick="$('rf').click()">Tiklash</button></div><input type="file" id="rf" accept=".json,application/json" hidden onchange="rst(this)"></div><div class="card"><b>Kitoblar:</b> ${S.books.length} · <b>So'zlar:</b> ${S.books.reduce((a,b)=>a+total(b),0)}</div>
  <button class="btn o" style="width:100%" onclick="delAcc()">Akkauntni o'chirish</button>`;
 }
}
const K=["G’oya","Qahramon","Qoralama"];
const LC=[["o'","ў"],["g'","ғ"],["sh","ш"],["ch","ч"],["yo","ё"],["yu","ю"],["ya","я"],["ye","е"],["ts","ц"]];
const LM={};"aа bб dд eе fф gг hҳ iи jж kк lл mм nн oо pп qқ rр sс tт uу vв xх yй zз".split(" ").forEach(p=>LM[p[0]]=p[1]);Object.assign(LM,{"ö":"ў","ğ":"ғ","ş":"ш","ç":"ч"});
const CM={"а":"a","б":"b","в":"v","г":"g","д":"d","е":"e","ё":"yo","ж":"j","з":"z","и":"i","й":"y","к":"k","л":"l","м":"m","н":"n","о":"o","п":"p","р":"r","с":"s","т":"t","у":"u","ф":"f","х":"x","ц":"ts","ч":"ch","ш":"sh","щ":"shch","ъ":"’","ы":"i","ь":"","э":"e","ю":"yu","я":"ya","ў":"o‘","қ":"q","ғ":"g‘","ҳ":"h"};
function l2c(t){t=t.replace(/[ʻʼ‘’`´]/g,"'");let o="",i=0;while(i<t.length){let m=0;for(const [a,b] of LC){const s=t.substr(i,a.length);if(s.toLowerCase()==a){o+=s[0]!=s[0].toLowerCase()?b.toUpperCase():b;i+=a.length;m=1;break}}if(m)continue;const ch=t[i],l=ch.toLowerCase();let r=LM[l];if(r){if(l=="e"&&!/[a-zA-Z']/.test(t[i-1]||" "))r="э";o+=ch!=l?r.toUpperCase():r}else o+=(ch=="'"?"ъ":ch);i++}return o}
function c2l(t){return t.replace(/[\s\S]/g,ch=>{const l=ch.toLowerCase(),r=CM[l];if(r===undefined)return ch;if(!r)return "";return ch!=l?r[0].toUpperCase()+r.slice(1):r})}
function keep(){const a=$("ta");if(a){S.cp=a.selectionStart;S.sy=a.scrollTop}}
function restore(){const a=$("ta");if(a){a.scrollTop=S.sy||0;if(S.cp>0&&S.cp<=a.value.length){a.focus({preventScroll:true});a.setSelectionRange(S.cp,S.cp);a.scrollTop=S.sy||0}}}
function resume(){const b=B(),c=b.ch[S.ci];if(!c||!total(b))return "";return `<div class="card" style="border-color:var(--ac)"><small>Oxirgi joyingiz</small><br><b>${esc(b.title)}</b> · ${esc(c.t)}<button class="btn" style="width:100%;margin-top:8px" onclick="go('write')">Shu joydan davom etish →</button></div>`}
function pic(i){const f=i.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement("canvas");c.width=340;c.height=480;const x=c.getContext("2d"),k=Math.max(340/im.width,480/im.height),w=im.width*k,h=im.height*k;x.drawImage(im,(340-w)/2,(480-h)/2,w,h);B().img=c.toDataURL("image/jpeg",.8);save();render()};im.src=r.result};r.readAsDataURL(f)}
function rmi(){B().img="";save();render()}
function addN(k){S.notes.unshift({k,t:"",x:""});save();render()}
function delN(i){if(S.dn===i){S.notes.splice(i,1);S.dn=-1;save();render()}else{S.dn=i;toast("Yana bosing: o‘chiriladi")}}
function toCh(i){const n=S.notes[i];B().ch[S.ci].x+="\n\n"+n.x;save();toast("Joriy bobga qo‘shildi")}
function notesV(){const n=S.notes;$("m").innerHTML=`<h2>Daftar</h2><div class="row">${K.map((k,i)=>`<button class="btn o" onclick="addN(${i})">+ ${k}</button>`).join("")}</div>`+(n.length?"":`<p class="m">Hozircha bo‘sh. G’oya, qahramon yoki qoralama qo‘shing.</p>`)+n.map((o,i)=>`<div class="card"><div class="row"><small>${K[o.k]}</small><button class="btn o" style="flex:0 0 auto" onclick="delN(${i})">🗑</button></div><input value="${esc(o.t)}" placeholder="${o.k==1?"Ism, yosh, xarakter":"Sarlavha"}" oninput="S.notes[${i}].t=this.value;save()"><textarea style="min-height:90px" placeholder="${o.k==1?"Tashqi ko‘rinishi, maqsadi, sirlari…":"Yozing…"}" oninput="S.notes[${i}].x=this.value;save()">${esc(o.x)}</textarea>${o.k==2?`<button class="btn o" onclick="toCh(${i})">Joriy bobga qo‘shish</button>`:""}</div>`).join("")}
