<!DOCTYPE html>
<html lang="uz"><head><meta charset="utf-8"><title>Muallif</title><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#b4562b"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#faf6ef;--card:#fff;--tx:#2b2118;--mut:#8a7b6b;--ac:#b4562b;--ln:#e8dfd1;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#1b1612;--card:#262019;--tx:#f1e8dc;--mut:#a69683;--ac:#e0885a;--ln:#3a3128}}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:16px/1.5 Georgia,serif;display:flex;flex-direction:column;max-width:520px;margin:auto}
header{padding:14px 18px 6px;font-size:22px;font-weight:bold;color:var(--ac)}
main{flex:1;overflow:auto;padding:8px 18px 20px}
nav{display:flex;border-top:1px solid var(--ln);background:var(--card)}
nav button{flex:1;border:0;background:none;padding:10px 0;color:var(--mut);font:12px system-ui,sans-serif}
nav button.on{color:var(--ac);font-weight:bold}nav b{display:block;font-size:20px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:16px;padding:14px;margin:12px 0;box-shadow:0 3px 12px #0000000f}
input,textarea,select{width:100%;padding:10px;border:1px solid var(--ln);border-radius:10px;background:var(--card);color:var(--tx);font:inherit;margin:4px 0}
textarea{min-height:42vh;resize:vertical;line-height:1.7}
.btn{box-shadow:0 2px 6px #0002;background:var(--ac);color:#fff;border:0;border-radius:10px;padding:10px 16px;font:600 14px system-ui,sans-serif}
.btn.o{background:none;color:var(--ac);border:1px solid var(--ac)}
.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}
small,.m{color:var(--mut);font:13px system-ui,sans-serif}
.bar{height:8px;background:var(--ln);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac)}
.cover{width:170px;height:240px;margin:10px auto;border-radius:6px 12px 12px 6px;display:flex;flex-direction:column;justify-content:space-between;align-items:center;text-align:center;padding:26px 14px;color:#fff;box-shadow:6px 8px 18px #0004;border-left:8px solid #0003}
.cover h3{margin:0;font-size:22px;line-height:1.2}.cover p{margin:0;font-size:14px;letter-spacing:1px}
.sw{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0}.sw span{width:34px;height:34px;border-radius:50%;border:3px solid transparent}.sw span.on{border-color:var(--tx)}
.mini{display:flex;gap:12px;align-items:center}.mini .cover{width:56px;height:80px;margin:0;padding:8px 4px;font-size:8px;box-shadow:2px 3px 6px #0003}.mini .cover h3{font-size:9px}.mini .cover p{display:none}
#sheet{position:fixed;inset:0;background:#0007;display:none;align-items:flex-end;justify-content:center}
#sheet.show{display:flex}#sheet>div{background:var(--card);width:100%;max-width:520px;border-radius:20px 20px 0 0;padding:20px;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px))}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:9px 16px;border-radius:20px;font:13px system-ui;display:none;max-width:90%;text-align:center}
h2{margin:6px 0;font-size:19px}

body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
h2,header,.cover h3,.hero .hq,textarea#ta{font-family:Georgia,"Times New Roman",serif}
header{display:flex;align-items:center;gap:8px;padding:16px 20px 8px;font-size:25px;letter-spacing:.3px}
header::after{content:"kitob yozish makoni";font:12px system-ui,sans-serif;color:var(--mut);margin-left:auto}
main{padding:6px 18px 24px}
main>*{animation:up .35s ease both}
@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
h2{font-size:22px;margin:14px 0 4px}
nav{margin:0 12px 10px;border:1px solid var(--ln);border-radius:24px;box-shadow:0 8px 24px #0000001f;padding:5px;gap:2px}
nav button{border-radius:19px;padding:8px 0;transition:.2s}
nav button.on{background:color-mix(in srgb,var(--ac) 15%,transparent);color:var(--ac)}
nav b{font-size:21px}
.btn{border-radius:999px;padding:11px 18px;transition:transform .15s;background:linear-gradient(135deg,var(--ac),color-mix(in srgb,var(--ac) 68%,#000))}
.btn:active{transform:scale(.96)}
input,textarea,select{border-radius:12px;padding:12px;outline:none;transition:border-color .2s,box-shadow .2s}
input:focus,textarea:focus,select:focus{border-color:var(--ac);box-shadow:0 0 0 3px color-mix(in srgb,var(--ac) 22%,transparent)}
textarea#ta{font-size:18px;line-height:1.85;padding:18px;border-radius:18px;min-height:46vh;box-shadow:inset 0 1px 6px #00000012}
.bar{height:10px;border-radius:8px}
.bar i{background:linear-gradient(90deg,var(--ac),color-mix(in srgb,var(--ac) 50%,#fff));border-radius:8px;transition:width .4s}
.mini .cover{width:74px;height:104px;font-size:10px}
.mini .cover h3{font-size:11px}
.cover{box-shadow:0 12px 26px #00000040,inset -3px 0 6px #0003}
.cover h3{text-shadow:0 1px 3px #0006}
.sw span{box-shadow:0 2px 6px #0003;transition:transform .15s}
.sw span.on{transform:scale(1.15)}
.hero{background:linear-gradient(135deg,var(--ac),color-mix(in srgb,var(--ac) 55%,#000));color:#fff;border-radius:24px;padding:18px 20px;margin:8px 0 6px;box-shadow:0 10px 26px color-mix(in srgb,var(--ac) 35%,transparent)}
.hero small{color:#ffffffd0}
.hero .hq{font-size:24px;font-weight:bold;margin:2px 0 12px}
.hero .bar{background:#ffffff38;margin-bottom:6px}
.hero .bar i{background:#fff}
#sheet>div{animation:sl .3s ease}
@keyframes sl{from{transform:translateY(100%)}}
#toast{box-shadow:0 6px 18px #0004}
::selection{background:color-mix(in srgb,var(--ac) 30%,transparent)}
#cs{margin-left:auto;font:12px system-ui,sans-serif;color:var(--mut)}header::after{content:none}
</style></head><body>
<header>✒️ Muallif<span id="cs"></span></header>
<main id="m"></main>
<nav id="nav"></nav>
<div id="sheet"><div id="sb"></div></div><div id="toast"></div>
<script>
const GR=[["#b4562b","#6e2a12"],["#2f6f6a","#123a37"],["#4b3f8f","#1f1a48"],["#2b2b2b","#000"],["#a8325e","#4a0f27"]];
const FONTS=["Georgia,serif","system-ui,sans-serif","'Courier New',monospace"];
let S={tab:"books",bi:0,ci:0,cp:0,sy:0,notes:[],paid:false,goal:500,books:[{title:"Mening birinchi kitobim",author:"Muallif",g:0,f:0,ch:[{t:"1-bob",x:""}]}]};
try{const r=localStorage.getItem("muallif");if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
const $=id=>document.getElementById(id);
const save=()=>{try{localStorage.setItem("muallif",JSON.stringify(S))}catch(e){toast("Xotira to‘ldi: saqlanmadi")}sched()};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
if(!S.books[S.bi])S.bi=0;const B=()=>S.books[S.bi];
const words=t=>(t.trim().match(/\S+/g)||[]).length;
const total=b=>b.ch.reduce((a,c)=>a+words(c.x),0);
function toast(t){const e=$("toast");e.textContent=t;e.style.display="block";setTimeout(()=>e.style.display="none",2600)}
function cov(b,cls=""){const g=GR[b.g];return `<div class="cover ${cls}" style="background:${b.img?`linear-gradient(#0004,#0008),url(${b.img}) center/cover`:`linear-gradient(160deg,${g[0]},${g[1]})`};font-family:${FONTS[b.f]}"><h3>${esc(b.title)||"Sarlavha"}</h3><p>${esc(b.author)||"Muallif"}</p></div>`}
function go(t){keep();S.tab=t;save();render()}
function render(){
 const T=[["books","📚","Kitoblar"],["write","✍️","Yozish"],["notes","💡","Daftar"],["cover","🎨","Muqova"],["me","👤","Profil"]];
 $("nav").innerHTML=T.map(a=>`<button class="${S.tab==a[0]?"on":""}" onclick="go('${a[0]}')"><b>${a[1]}</b>${a[2]}</button>`).join("");
 const m=$("m");
 if(S.tab=="books"){
  m.innerHTML=`<div class="hero"><small>Salom, muallif 👋</small><div class="hq">Bugun nima yozamiz?</div><div class="bar"><i style="width:${Math.min(100,total(B())/S.goal*100)}%"></i></div><small>${total(B())} / ${S.goal} so‘z</small></div><h2>Mening kitoblarim</h2>`+resume()+S.books.map((b,i)=>`<div class="card mini">${cov(b)}<div style="flex:1"><b>${esc(b.title)}</b><br><small>${b.ch.length} bob · ${total(b)} so'z</small><div class="row" style="margin-top:8px"><button class="btn" onclick="if(S.bi!=${i}){S.cp=0;S.sy=0}S.bi=${i};S.ci=S.books[${i}].lc||0;go('write')">Yozish</button><button class="btn o" onclick="S.bi=${i};go('cover')">Muqova</button></div></div></div>`).join("")+
  `<button class="btn" style="width:100%" onclick="newBook()">+ Yangi kitob</button><p class="m">Birinchi kitob bepul. Keyingilari uchun obuna kerak.</p>`;
 }
 if(S.tab=="write"){
  const b=B();if(!b.ch[S.ci])S.ci=0;b.lc=S.ci;const c=b.ch[S.ci],w=total(b),p=Math.min(100,w/S.goal*100);
  m.innerHTML=`<div class="row"><select onchange="S.ci=+this.value;S.cp=0;S.sy=0;save();render()">${b.ch.map((x,i)=>`<option value="${i}" ${i==S.ci?"selected":""}>${esc(x.t)}</option>`).join("")}</select><button class="btn o" style="flex:0 0 auto" onclick="addCh()">+ Bob</button></div>
  <input value="${esc(c.t)}" oninput="B().ch[S.ci].t=this.value;save()" placeholder="Bob nomi">
  <textarea id="ta" onblur="keep();save()" onscroll="S.sy=this.scrollTop" placeholder="Hikoyangizni shu yerda yozing…" oninput="B().ch[S.ci].x=this.value;S.cp=this.selectionStart;S.sy=this.scrollTop;save();stat()">${esc(c.x)}</textarea>
  <div class="bar"><i id="pb" style="width:${p}%"></i></div><small id="st"></small>
  <div class="row" style="margin-top:10px"><button class="btn o" onclick="tr()">Lotin ⇄ Кирилл</button><button class="btn" onclick="exp()">Yuklab olish</button></div>`;stat();restore();
 }
 if(S.tab=="cover"){
  const b=B();
  m.innerHTML=`<h2>Muqova</h2>${cov(b)}<input value="${esc(b.title)}" oninput="B().title=this.value;save();pv()" placeholder="Kitob nomi"><input value="${esc(b.author)}" oninput="B().author=this.value;save();pv()" placeholder="Muallif">
  <input type="file" id="fi" accept="image/*" hidden onchange="pic(this)">${b.img?`<button class="btn o" style="width:100%;margin:6px 0" onclick="rmi()">Rasmni olib tashlash</button>`:""}<small>Rang</small><div class="sw">${GR.map((g,i)=>`<span class="${b.g==i?"on":""}" style="background:${g[0]}" onclick="B().g=${i};save();render()"></span>`).join("")}</div>
  <small>Shrift</small><select onchange="B().f=+this.value;save();render()">${["Klassik","Zamonaviy","Mashinka"].map((n,i)=>`<option value="${i}" ${b.f==i?"selected":""}>${n}</option>`).join("")}</select>
  <button class="btn o" style="width:100%;margin-top:8px" onclick="$('fi').click()">📷 O'z rasmimni yuklash</button>`;
 }
 if(S.tab=="notes")notesV();if(S.tab=="me"){
  m.innerHTML=`<h2>Profil</h2>${cloudCard()}<div class="card"><b>Muallif</b><br><small>${S.paid?"Premium · cheksiz kitoblar":"Bepul reja · 1 ta kitob"}</small>
  ${S.paid?"":`<button class="btn" style="width:100%;margin-top:10px" onclick="pay()">Premiumga o'tish</button>`}</div>
  <div class="card"><b>Kunlik maqsad</b><input type="number" value="${S.goal}" oninput="S.goal=+this.value||1;save()"><small>so'z</small></div>
  <div class="card"><b>Rang mavzusi</b> <small>${S.th==null?"Avto":TH[S.th].n}</small><div class="sw" style="margin-top:8px"><span class="${S.th==null?"on":""}" style="background:linear-gradient(135deg,#faf6ef 50%,#1b1612 50%)" onclick="setTh(null)"></span>${TH.map((t,i)=>`<span class="${S.th===i?"on":""}" style="background:${t.ac}" onclick="setTh(${i})"></span>`).join("")}</div></div><div class="card"><b>Zaxira nusxa</b><br><small>${S.pst?"Xotira himoyalangan ✓":"Xotira himoyasiz, zaxira oling"}${S.lb?" · oxirgi zaxira: "+S.lb:""}</small><div class="row" style="margin-top:8px"><button class="btn" onclick="bak()">Faylga saqlash</button><button class="btn o" onclick="$('rf').click()">Tiklash</button></div><input type="file" id="rf" accept=".json,application/json" hidden onchange="rst(this)"></div><div class="card"><b>Kitoblar:</b> ${S.books.length} · <b>So'zlar:</b> ${S.books.reduce((a,b)=>a+total(b),0)}</div>
  <button class="btn o" style="width:100%" onclick="toast('Akkauntni o\\'chirish: to\\'liq ilovada')">Akkauntni o'chirish</button>`;
 }
}
const K=["G’oya","Qahramon","Qoralama"];
const LC=[["o'","ў"],["g'","ғ"],["sh","ш"],["ch","ч"],["yo","ё"],["yu","ю"],["ya","я"],["ye","е"],["ts","ц"]];
const LM={};"aа bб dд eе fф gг hҳ iи jж kк lл mм nн oо pп qқ rр sс tт uу vв xх yй zз".split(" ").forEach(p=>LM[p[0]]=p[1]);
const CM={"а":"a","б":"b","в":"v","г":"g","д":"d","е":"e","ё":"yo","ж":"j","з":"z","и":"i","й":"y","к":"k","л":"l","м":"m","н":"n","о":"o","п":"p","р":"r","с":"s","т":"t","у":"u","ф":"f","х":"x","ц":"ts","ч":"ch","ш":"sh","щ":"shch","ъ":"'","ы":"i","ь":"","э":"e","ю":"yu","я":"ya","ў":"o'","қ":"q","ғ":"g'","ҳ":"h"};
function l2c(t){t=t.replace(/[ʻʼ‘’`´]/g,"'");let o="",i=0;while(i<t.length){let m=0;for(const [a,b] of LC){const s=t.substr(i,a.length);if(s.toLowerCase()==a){o+=s[0]!=s[0].toLowerCase()?b.toUpperCase():b;i+=a.length;m=1;break}}if(m)continue;const ch=t[i],l=ch.toLowerCase();let r=LM[l];if(r){if(l=="e"&&!/[a-zA-Z']/.test(t[i-1]||" "))r="э";o+=ch!=l?r.toUpperCase():r}else o+=ch;i++}return o}
function c2l(t){return t.replace(/[\s\S]/g,ch=>{const l=ch.toLowerCase(),r=CM[l];if(r===undefined)return ch;if(!r)return "";return ch!=l?r[0].toUpperCase()+r.slice(1):r})}
function tr(){const c=B().ch[S.ci],cy=/[а-яёўқғҳ]/i.test(c.x+c.t);c.x=cy?c2l(c.x):l2c(c.x);c.t=cy?c2l(c.t):l2c(c.t);S.cp=0;save();render();toast(cy?"Lotinga o‘tkazildi":"Kirillga o‘tkazildi")}
function keep(){const a=$("ta");if(a){S.cp=a.selectionStart;S.sy=a.scrollTop}}
function restore(){const a=$("ta");if(a){a.scrollTop=S.sy||0;if(S.cp>0&&S.cp<=a.value.length){a.focus({preventScroll:true});a.setSelectionRange(S.cp,S.cp);a.scrollTop=S.sy||0}}}
function resume(){const b=B(),c=b.ch[S.ci];if(!c||!total(b))return "";return `<div class="card" style="border-color:var(--ac)"><small>Oxirgi joyingiz</small><br><b>${esc(b.title)}</b> · ${esc(c.t)}<button class="btn" style="width:100%;margin-top:8px" onclick="go('write')">Shu joydan davom etish →</button></div>`}
function pic(i){const f=i.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement("canvas");c.width=340;c.height=480;const x=c.getContext("2d"),k=Math.max(340/im.width,480/im.height),w=im.width*k,h=im.height*k;x.drawImage(im,(340-w)/2,(480-h)/2,w,h);B().img=c.toDataURL("image/jpeg",.8);save();render()};im.src=r.result};r.readAsDataURL(f)}
function rmi(){B().img="";save();render()}
function addN(k){S.notes.unshift({k,t:"",x:""});save();render()}
function delN(i){if(S.dn===i){S.notes.splice(i,1);S.dn=-1;save();render()}else{S.dn=i;toast("Yana bosing: o‘chiriladi")}}
function toCh(i){const n=S.notes[i];B().ch[S.ci].x+="\n\n"+n.x;save();toast("Joriy bobga qo‘shildi")}
function notesV(){const n=S.notes;$("m").innerHTML=`<h2>Daftar</h2><div class="row">${K.map((k,i)=>`<button class="btn o" onclick="addN(${i})">+ ${k}</button>`).join("")}</div>`+(n.length?"":`<p class="m">Hozircha bo‘sh. G’oya, qahramon yoki qoralama qo‘shing.</p>`)+n.map((o,i)=>`<div class="card"><div class="row"><small>${K[o.k]}</small><button class="btn o" style="flex:0 0 auto" onclick="delN(${i})">🗑</button></div><input value="${esc(o.t)}" placeholder="${o.k==1?"Ism, yosh, xarakter":"Sarlavha"}" oninput="S.notes[${i}].t=this.value;save()"><textarea style="min-height:90px" placeholder="${o.k==1?"Tashqi ko‘rinishi, maqsadi, sirlari…":"Yozing…"}" oninput="S.notes[${i}].x=this.value;save()">${esc(o.x)}</textarea>${o.k==2?`<button class="btn o" onclick="toCh(${i})">Joriy bobga qo‘shish</button>`:""}</div>`).join("")}
function bak(){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:"application/json"}));a.download="muallif-zaxira.json";document.body.appendChild(a);a.click();a.remove();S.lb=new Date().toLocaleDateString();save();toast("Zaxira fayl yuklandi");render()}
function rst(i){const f=i.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d.books)||!d.books.length)throw 0;Object.assign(S,d);if(!S.books[S.bi])S.bi=0;S.tab="books";save();render();toast("Kitoblar tiklandi ✓")}catch(e){toast("Fayl noto‘g‘ri")}};r.readAsText(f)}
const TH=[{n:"Iliq",bg:"#faf6ef",card:"#fff",tx:"#2b2118",mut:"#8a7b6b",ac:"#b4562b",ln:"#e8dfd1"},{n:"Dengiz",bg:"#f0f7f8",card:"#fff",tx:"#14292e",mut:"#6b8389",ac:"#0f7c8a",ln:"#d3e6e9"},{n:"O‘rmon",bg:"#f2f7ee",card:"#fff",tx:"#1d2a1c",mut:"#74856f",ac:"#3d7a45",ln:"#d9e7d3"},{n:"Binafsha",bg:"#f6f2fb",card:"#fff",tx:"#241a33",mut:"#80728f",ac:"#7b4bb7",ln:"#e4daef"},{n:"Atirgul",bg:"#fdf3f6",card:"#fff",tx:"#331a22",mut:"#94707b",ac:"#c2385f",ln:"#f1dae1"},{n:"Tun",bg:"#15171c",card:"#1f2229",tx:"#eceef2",mut:"#9aa1ad",ac:"#e8a64a",ln:"#2d313a"}];
function applyTh(){const r=document.documentElement.style,t=S.th==null?null:TH[S.th];["bg","card","tx","mut","ac","ln"].forEach(k=>t?r.setProperty("--"+k,t[k]):r.removeProperty("--"+k));const m=document.querySelector('meta[name=theme-color]');if(m)m.content=t?t.ac:"#b4562b"}
function setTh(i){S.th=i;save();applyTh();render()}
function crc(u){let t=crc.t,c;if(!t){t=crc.t=[];for(let n=0;n<256;n++){c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}}let r=-1;for(let i=0;i<u.length;i++)r=t[(r^u[i])&255]^(r>>>8);return(r^-1)>>>0}
function zip(fs){const E=new TextEncoder(),P=[],D=[],a16=(a,v)=>a.push(v&255,v>>8&255),a32=(a,v)=>a.push(v&255,v>>8&255,v>>16&255,v>>>24&255);let off=0;
for(const f of fs){const nm=E.encode(f.n),c=crc(f.d),n=f.d.length,h=[];a32(h,0x04034b50);a16(h,20);a16(h,0x0800);a16(h,0);a16(h,0);a16(h,0x21);a32(h,c);a32(h,n);a32(h,n);a16(h,nm.length);a16(h,0);P.push(new Uint8Array(h),nm,f.d);
const g=[];a32(g,0x02014b50);a16(g,20);a16(g,20);a16(g,0x0800);a16(g,0);a16(g,0);a16(g,0x21);a32(g,c);a32(g,n);a32(g,n);a16(g,nm.length);a16(g,0);a16(g,0);a16(g,0);a16(g,0);a32(g,0);a32(g,off);D.push(new Uint8Array(g),nm);off+=h.length+nm.length+n}
let cs=0;D.forEach(x=>cs+=x.length);const e=[];a32(e,0x06054b50);a16(e,0);a16(e,0);a16(e,fs.length);a16(e,fs.length);a32(e,cs);a32(e,off);a16(e,0);
